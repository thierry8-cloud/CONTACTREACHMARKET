# Netlify Configuration for ContactReach Market
[build]
  command = "npm run build"
  publish = "dist"

# Do not rewrite /api/* to index.html (preserves clean 404 or backend proxy if configured)
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 404

# Single-page application fallback: reroute all paths to index.html with HTTP 200 (prevents 404 on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets with high longevity
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
